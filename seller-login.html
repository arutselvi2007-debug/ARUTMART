<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArulMart - Seller Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page seller-login-page">

        <div class="login-box seller-login-box">

            <a href="index.html" class="back-link">← Back to roles</a>

            <div class="login-logo">
                <span>Arul</span>Mart
            </div>

            <p class="login-label seller-label">SELLER ACCOUNT</p>

            <h1>Grow your business.</h1>

            <p class="login-description">
                Sign in to manage your products, orders, and sales.
            </p>

            <form id="sellerLoginForm">

                <label for="sellerEmail">Seller Email</label>

                <input
                    type="text"
                    id="sellerEmail"
                    placeholder="Enter your seller email"
                >

                <label for="sellerPassword">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="sellerPassword"
                        placeholder="Enter your password"
                    >

                    <button
                        type="button"
                        id="toggleSellerPassword"
                    >
                        Show
                    </button>

                </div>

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="forgot-link">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="login-button seller-button">
                    Seller Login
                </button>

            </form>

            <p class="signup-text">
                Want to sell on ArulMart?
                <a href="#">Become a seller</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
