<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArulMart - Seller Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-page">

        <header class="dashboard-header">

            <div class="dashboard-logo">
                <span>Arul</span>Mart
            </div>

            <a href="index.html" class="logout-link">Logout</a>

        </header>

        <main class="seller-dashboard">

            <div class="dashboard-welcome">
                <p class="dashboard-label">SELLER PANEL</p>

                <h1>Welcome, Seller!</h1>

                <p>
                    Manage your products, orders, and sales from one place.
                </p>
            </div>

            <div class="seller-stats">

                <div class="stat-card">
                    <span class="stat-number">0</span>
                    <span class="stat-title">Products</span>
                </div>

                <div class="stat-card">
                    <span class="stat-number">0</span>
                    <span class="stat-title">Orders</span>
                </div>

                <div class="stat-card">
                    <span class="stat-number">₹0</span>
                    <span class="stat-title">Total Sales</span>
                </div>

            </div>

            <section class="seller-actions">

                <div class="action-card">
                    <h2>Manage Products</h2>
                    <p>Add, edit, and manage your products.</p>
                    <a href="seller-products.html" class="manage-products-button">
    Manage Products
</a>
                </div>

                <div class="action-card">
                    <h2>Orders</h2>
